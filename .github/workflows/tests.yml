name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Belt-and-suspenders: some deps (e.g. harmonypy) build a C++ extension.
      # ubuntu-latest images normally ship build-essential/cmake already, but
      # pin the requirement explicitly so the workflow doesn't silently start
      # failing if the runner image ever changes.
      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v
